<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0}</style>
</head>
<body>
<title>Mar da Madeira</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: kiosk screen in three bands — controls | living food web | what changed. Stacks on phones. Deliberately single dark "deep water" look. */
:root {
  --abyss: #061820;
  --deep: #0b2733;
  --panel: #0f3242;
  --line: #1d4a5c;
  --fg: #e9f2f1;
  --muted: #93b3b9;
  --sand: #f0c35a;
  --up: #5fd6a8;
  --down: #ff806f;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 0%, #0e3443 0%, var(--abyss) 60%) fixed, var(--abyss);
  color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.4;
}
.wrap {
  min-height: 100%; display: flex; flex-direction: column; gap: 14px;
  padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1680px; margin: 0 auto; box-sizing: border-box;
}
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--sand); font-weight: 700; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 3.4vw, 52px); line-height: 1; margin: 4px 0 0; text-wrap: balance; letter-spacing: -.01em; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }
.head-actions { display: flex; gap: 8px; align-items: center; }
button { font: inherit; color: inherit; cursor: pointer; }
.chip {
  border: 1px solid var(--line); background: var(--deep); border-radius: 999px; padding: 10px 16px; min-height: 44px;
  font-weight: 700; font-size: 15px; transition: background .15s, border-color .15s;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--sand); color: var(--abyss); border-color: var(--sand); }
.chip:focus-visible, input[type=range]:focus-visible { outline: 3px solid var(--sand); outline-offset: 2px; }

main { display: grid; grid-template-columns: minmax(260px, 330px) minmax(0, 1fr) minmax(280px, 360px); gap: 14px; flex: 1; min-height: 0; }
.panel { background: color-mix(in srgb, var(--panel) 82%, transparent); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.panel h2 { font-family: var(--display); font-weight: 500; font-size: 20px; margin: 0 0 4px; }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.presets .chip { padding: 8px 10px; }
.ctrl { padding: 8px 0 4px; border-top: 1px solid var(--line); }
.ctrl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ctrl label { font-weight: 700; font-size: 16px; }
.ctrl .sub { color: var(--muted); font-size: 13px; }
.val { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--sand); white-space: nowrap; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 40px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--sand) var(--p, 33%), var(--line) var(--p, 33%)); }
input[type=range]::-moz-range-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--sand) var(--p, 33%), var(--line) var(--p, 33%)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; border-radius: 50%; background: var(--fg); border: 4px solid var(--sand); margin-top: -12px; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--fg); border: 4px solid var(--sand); }
.scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: -4px; }

.web { display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 10px; }
.clock { display: flex; align-items: center; gap: 14px; }
.year { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 2.6vw, 40px); font-variant-numeric: tabular-nums; min-width: 6.5ch; }
.year small { font-size: .45em; font-weight: 500; color: var(--muted); display: block; letter-spacing: .08em; text-transform: uppercase; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--sand); }
.svgbox { flex: 1; min-height: 320px; position: relative; }
svg.food { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tl-label { fill: var(--muted); font-size: 12px; font-family: var(--body); }
.tl-line { stroke: var(--line); stroke-dasharray: 3 5; }
.link { fill: none; stroke: var(--muted); stroke-linecap: round; }
.node { cursor: pointer; outline: none; }
.node:focus-visible circle.body { stroke: var(--sand); stroke-width: 4; }
.node circle.body { stroke-width: 3; }
.node text { fill: var(--fg); font-size: 13px; font-family: var(--body); font-weight: 700; paint-order: stroke; stroke: var(--abyss); stroke-width: 4px; stroke-linejoin: round; text-anchor: middle; }
.node text.pct { font-size: 13px; font-weight: 700; }
.node.sel circle.halo { stroke: var(--sand); stroke-width: 3; fill: none; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; background: var(--c); }

.side { display: flex; flex-direction: column; gap: 14px; }
.story { font-size: 17px; line-height: 1.45; margin: 0; min-height: 3.2em; }
.story b.up { color: var(--up); } .story b.down { color: var(--down); }
.tile { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 10px; padding: 12px 14px; border-radius: 12px; background: var(--deep); border: 1px solid var(--line); margin-top: 12px; }
.tile .k { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.tile .v { font-family: var(--display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .d { font-variant-numeric: tabular-nums; font-weight: 700; }
.ind { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.ind li button { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 42% 5ch; align-items: center; gap: 10px; padding: 4px 6px; border: 0; border-radius: 10px; background: transparent; text-align: left; min-height: 44px; }
.ind li button:hover, .ind li button[aria-current="true"] { background: var(--deep); }
.ind .nm { font-weight: 700; font-size: 15px; min-width: 0; }
.ind .track { position: relative; height: 12px; background: var(--deep); border-radius: 6px; }
.ind .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--muted); opacity: .6; }
.ind .fill { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.ind .pc { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; font-size: 14px; }
.detail h3 { font-family: var(--display); font-size: 20px; font-weight: 500; margin: 0; }
.detail p { color: var(--muted); margin: 4px 0 8px; font-size: 14px; }
svg.spark { width: 100%; height: 110px; display: block; }
.spark .ax { fill: var(--muted); font-size: 11px; font-family: var(--body); }
footer { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.badge { color: var(--abyss); background: var(--sand); border-radius: 4px; padding: 1px 6px; font-weight: 700; margin-right: 6px; }

@media (min-width: 1181px) and (min-height: 860px) {
  .wrap { height: 100%; }
  main { min-height: 0; }
  main > .panel, .side { overflow: auto; }
  .side .panel { padding: 12px 16px; }
  .tile { margin-top: 8px; padding: 8px 12px; }
  .tile .v { font-size: 26px; }
  .hint { margin-bottom: 8px; }
}
@media (max-width: 1180px) {
  main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .web { grid-column: 1 / -1; order: -1; }
  .svgbox { min-height: 0; aspect-ratio: 1070 / 610; flex: none; }
}
@media (max-width: 720px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .node text { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { .chip { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="title"></h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="head-actions">
      <button class="chip" id="lang-pt" aria-pressed="true">PT</button>
      <button class="chip" id="lang-en" aria-pressed="false">EN</button>
      <button class="chip" id="reset" data-t="reset"></button>
    </div>
  </header>

  <main>
    <section class="panel" aria-labelledby="ctrl-h">
      <h2 id="ctrl-h" data-t="ctrlTitle"></h2>
      <p class="hint" data-t="ctrlHint"></p>
      <div class="presets" id="presets"></div>
      <div id="controls"></div>
    </section>

    <section class="panel web" aria-labelledby="web-h">
      <h2 id="web-h" class="sr" hidden data-t="webTitle"></h2>
      <div class="clock">
        <div class="year" id="year"></div>
        <div class="bar"><i id="bar"></i></div>
      </div>
      <div class="svgbox"><svg class="food" id="food" viewBox="0 0 1070 610" role="img"></svg></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="side">
      <div class="panel">
        <h2 data-t="whatTitle"></h2>
        <p class="story" id="story" aria-live="polite"></p>
        <div class="tile">
          <span class="k" data-t="catchK"></span><span class="d" id="catchD"></span>
          <span class="v" id="catchV"></span><span></span>
        </div>
      </div>
      <div class="panel">
        <h2 data-t="indTitle"></h2>
        <ul class="ind" id="ind"></ul>
      </div>
      <div class="panel detail" id="detail">
        <h3 id="detName"></h3>
        <p id="detText"></p>
        <svg class="spark" id="spark" viewBox="0 0 320 120" role="img"></svg>
      </div>
    </section>
  </main>

  <footer>
    <span><span class="badge" data-t="proto"></span><span data-t="foot"></span></span>
    <span data-t="foot2"></span>
  </footer>
</div>

  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = L[el.dataset.t]; });
  CTRLS.forEach(c => { document.querySelector(`label[for="s-${c.id}"]`).textContent = L.ctrls[c.id][0]; $("sub-" + c.id).textContent = L.ctrls[c.id][1]; });
  document.querySelectorAll("#presets .chip").forEach(b => { b.textContent = L.presets[b.dataset.p]; });
  document.querySelectorAll(".scale span:nth-child(2)").forEach((s, k) => { if (CTRLS[k].pp) s.textContent = lang === "pt" ? "1× hoje" : "1× today"; });
  $("legend").innerHTML = `<span style="--c:var(--up)">${L.legUp}</span><span style="--c:var(--down)">${L.legDown}</span><span style="--c:var(--muted)">${L.legSame}</span><span>${L.legSize}</span>`;
  $("lang-pt").setAttribute("aria-pressed", String(lang === "pt")); $("lang-en").setAttribute("aria-pressed", String(lang === "en"));
  document.documentElement.lang = lang;
  syncSliders(); story(); render(frame);
}
// idle reset for the kiosk
let idleT = null;
function touch() { clearTimeout(idleT); idleT = setTimeout(() => { state = Object.assign({}, PRESETS.today); preset = "today"; lang = "pt"; selected = "lobo"; applyLang(); update(false); }, 120000); }

buildControls(); buildWeb(); buildInd();
$("lang-pt").addEventListener("click", () => { lang = "pt"; touch(); applyLang(); });
$("lang-en").addEventListener("click", () => { lang = "en"; touch(); applyLang(); });
$("reset").addEventListener("click", () => { state = Object.assign({}, PRESETS.today); preset = "today"; syncSliders(); touch(); update(false); });
// open in a working state: the "no fishing" scenario, already played to year 20
state = Object.assign({}, PRESETS.none); preset = "none";
result = sim.run(effortVec(), YEARS, state.PP, 12); frame = YEARS;
applyLang(); touch();
</script>
